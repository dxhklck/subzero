SubtitleTimelineBackwardFrameCount = 字幕タイムライン後退フレーム数
SubtitleTimelineBackwardFrameCountDesc = 徐々に出現する字幕処理用追加フレーム（デフォルト5）
subtitleTimelineForwardFrameCount = 字幕タイムライン前進フレーム数
subtitleTimelineForwardFrameCountDesc = 徐々に消える字幕処理用追加フレーム（デフォルト5）
SttnNeighborStride = 参照フレーム間隔
SttnNeighborStrideDesc = デフォルト: 5
SttnReferenceLength = 参照フレーム数
SttnReferenceLengthDesc = デフォルト: 10
SttnMaxLoadNum = 最大同時処理フレーム数
SttnMaxLoadNumDesc = 値が大きいほど高品質（VRAM要求増加、デフォルト50）
MiniMaxMaxLoadNum = 最大同時処理フレーム数
MiniMaxMaxLoadNumDesc = GPUに送るフレーム数（VRAM使用量を決定）：480pは81、720pは41、1080pは21、4Kは13~17（デフォルト81）
MiniMaxNumInferenceSteps = デノイズステップ数
MiniMaxNumInferenceStepsDesc = 大きいほど品質が僅かに向上するが速度は線形に低下、12が公式推奨バランス点（デフォルト8）
MiniMaxIterations = マスク拡張反復
MiniMaxIterationsDesc = 大きいほど字幕の残像が減るが周囲を損なう可能性あり、0で拡張なし（デフォルト6）
MiniMaxProcessWidth = 処理解像度の上限
MiniMaxProcessWidthDesc = 動画の幅がこの値を超える場合、縮小して推論し出力を元の解像度に戻します（0で元解像度）。1080p/4K は 960~1280 で大幅に高速化
MiniMaxStripPadding = ストリップ拡張ピクセル
MiniMaxStripPaddingDesc = ストリップ切り出し修復時にマスクの周囲に拡張する背景参照ピクセル。大きいほど品質は安定するが低速。0で拡張なし
