SubtitleAreaPixelToleranceXPixelDesc = Determina similitud horizontal entre subtítulos (valor predeterminado 20).  
SubtitleTimelineBackwardFrameCount = Retroceso en línea temporal  
SubtitleTimelineBackwardFrameCountDesc = Añade fotogramas antes de subtítulos detectados (valor predeterminado 5).  
subtitleTimelineForwardFrameCount = Avance en línea temporal  
subtitleTimelineForwardFrameCountDesc = Añade fotogramas después de subtítulos detectados (valor predeterminado 5).  
SttnNeighborStride = Intervalo de referencia  
SttnNeighborStrideDesc = Valor predeterminado: 5  
SttnReferenceLength = Cantidad de referencias  
SttnReferenceLengthDesc = Valor predeterminado: 10  
SttnMaxLoadNum = Máx. fotogramas simultáneos  
SttnMaxLoadNumDesc = Mayor valor mejora calidad pero requiere más VRAM (valor predeterminado 50).  
MiniMaxMaxLoadNum = Máx. fotogramas por lote
MiniMaxMaxLoadNumDesc = Fotogramas enviados a la GPU por pasada: principalmente un parámetro de velocidad - bloques más grandes amortizan el costo fijo y son más rápidos (prueba 720p: 121 fotogramas cerca de un décimo más rápido de extremo a extremo que 41), con poco efecto en el VRAM pico. El VRAM lo determina la resolución de la tira; la app valida el VRAM libre y registra un aviso - rara vez necesita ajuste manual
MiniMaxNumInferenceSteps = Pasos de denoising
MiniMaxNumInferenceStepsDesc = Un valor mayor mejora ligeramente la calidad pero ralentiza linealmente, 12 es el punto óptimo oficial (valor predeterminado 8).
MiniMaxIterations = Iteraciones de dilatación de máscara
MiniMaxIterationsDesc = Un valor mayor reduce los restos de subtítulos pero puede dañar los píxeles circundantes, 0 desactiva la dilatación (valor predeterminado 6).
MiniMaxProcessWidth = Límite de ancho de procesamiento
MiniMaxProcessWidthDesc = Si el vídeo es más ancho, se reduce para la inferencia y la salida se vuelve a ampliar (0 mantiene la resolución original). Para 1080p/4K use 960~1280 para acelerar
MiniMaxStripPadding = Píxeles de expansión de banda
MiniMaxStripPaddingDesc = Píxeles de contexto expandidos alrededor de la máscara en la reparación por recorte de banda; mayor es más estable pero más lento; 0 desactiva la expansión
MiniMaxUseSageAttention = Aceleración SageAttention
MiniMaxUseSageAttentionDesc = Ruta la auto-atención por SageAttention (K cuantizado INT8): atención más rápida y menos VRAM. Vuelve automáticamente a la implementación predeterminada si sageattention no está instalado. La cuantización puede afectar detalles finos
CheckUpdateOnStartup = Buscar actualizaciones al iniciar
CheckUpdateOnStartupDesc = Comprobar novedades en línea al iniciar
