SubtitleYXAxisDifferencePixel = Height-Width Pixel Difference Threshold  
SubtitleYXAxisDifferencePixelDesc = Determines non-subtitle regions (default 10). Subtitles generally have longer text boxes; if height exceeds width beyond this threshold, considered false detection.  
SubtitleAreaDeviationPixel = Allowed Pixel Offset  
SubtitleAreaDeviationPixelDesc = Enlarge mask size to prevent residual text edges during inpaint (default 20).  
SubtitleAreaYAxisDifferencePixel = Same-line Subtitle Height Difference Threshold  
SubtitleAreaYAxisDifferencePixelDesc = Determines if two text boxes belong to the same subtitle line (default 20 pixels).  
SubtitleAreaPixelToleranceYPixel = Y-axis Pixel Tolerance  
SubtitleAreaPixelToleranceYPixelDesc = Determines similarity between subtitle boxes on Y-axis (default 20 pixels).  
SubtitleAreaPixelToleranceXPixel = X-axis Pixel Tolerance  
SubtitleAreaPixelToleranceXPixelDesc = Determines similarity between subtitle boxes on X-axis (default 20 pixels).  
SubtitleTimelineBackwardFrameCount = Timeline Backward Frames  
SubtitleTimelineBackwardFrameCountDesc = Add frames before detected subtitles to handle slow fade-ins (default 5 frames).  
subtitleTimelineForwardFrameCount = Timeline Forward Frames  
subtitleTimelineForwardFrameCountDesc = Add frames after detected subtitles to handle slow fade-outs (default 5 frames).  
SttnNeighborStride = Reference Frame Stride  
SttnNeighborStrideDesc = Default: 5  
SttnReferenceLength = Reference Frame Count  
SttnReferenceLengthDesc = Default: 10  
SttnMaxLoadNum = Max Concurrent Processing Frames  
SttnMaxLoadNumDesc = Higher values improve quality but require more VRAM (default 50).  
MiniMaxMaxLoadNum = Max Frames per Batch
MiniMaxMaxLoadNumDesc = Frames fed to the GPU per pass - mainly a speed parameter: larger blocks amortize fixed overhead and run faster (720p test: 121 frames about a tenth faster end-to-end than 41), with little effect on peak VRAM. VRAM is set by strip resolution; the app checks free VRAM and logs a hint - manual changes rarely needed
MiniMaxNumInferenceSteps = Denoising Steps
MiniMaxNumInferenceStepsDesc = Higher values slightly improve quality but slow down linearly, 12 is the official sweet spot (default 8).
MiniMaxIterations = Mask Dilation Iterations
MiniMaxIterationsDesc = Higher values reduce subtitle ghosts but may damage surrounding pixels, 0 disables dilation (default 6).
MiniMaxProcessWidth = Process width limit
MiniMaxProcessWidthDesc = If the video is wider, it is downscaled for inference and the output upscaled back; 0 keeps original resolution. Set 960~1280 for 1080p/4K videos to greatly speed up
MiniMaxStripPadding = Strip padding pixels
MiniMaxStripPaddingDesc = Background context pixels expanded around the mask in strip crop inpainting; larger is steadier but slower; 0 disables padding
