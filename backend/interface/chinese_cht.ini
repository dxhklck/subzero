ResidueCheck = 殘留二次檢測修復
ResidueCheckDesc = 第一遍修復完成後對輸出重跑字幕檢測, 檢出殘留並自動二次修復; 無殘留時僅多花一次檢測時間
SelectionAsMask = 選區整片擦除
SelectionAsMaskDesc = 手動框選的字幕區域整體併入遮罩（檢測框 ∪ 選區），選區內一律視為字幕——根治描邊/藝術字的字形鬼影殘留；代價是選區內非字幕背景也會被重繪
SegmentMinutes = 影片分段時長(秒)
SegmentMinutesDesc = 處理時長超過該值的影片時自動分段執行, 中斷或關閉後重跑可從斷點續接; 0 = 不分段
SegmentOverlap = 段間重疊幀數
SegmentOverlapDesc = 段間重疊幀數, 為鄰幀模型提供段邊界上下文, 消除拼接接縫; 0 = 關閉
PipelineChunkFrames = 流水線分塊幀數
PipelineChunkFramesDesc = 檢測與去除並行：每檢測出該幀數即為一塊，檢測執行緒產出、修復執行緒消費（0 = 關閉流水線，回退為全片檢測完再修復）
PipelinePrefetchChunks = 流水線預取塊數
PipelinePrefetchChunksDesc = 先檢測出這麼多塊再開始去除：1 = 起步最快，2 = 預設（連貫性最好），越大起步越晚但緩衝更深
PipelineInfo = 流水線說明
PipelineInfoDesc = 檢測與修復並行後總耗時 ≈ max(檢測, 修復)；分塊只改變排程，不改變輸出（跨塊字幕區間分段修復，逐幀不重不漏）
SubtitleDetectModeDesc = 檢測字幕位置所用的 OCR 模型, 伺服器版精度更高, 本地版速度更快
GroupGeneral = 通用
GroupInpaint = 去除模型
GroupDetect = 字幕檢測
VideoEncoder = 視訊編碼器
VideoEncoderDesc = 自動偵測按 NVENC→QSV→AMF→x264 順序實測本機可用編碼器（有獨顯/核顯走硬體編碼，純 CPU 機器用 x264）；實際使用的編碼器會在處理日誌中輸出
MarkBoxTimeStart = 標記選框時間起點
MarkBoxTimeEnd = 標記選框時間終點
ClearBoxTime = 清除選框時間
OutputBitrate = 輸出碼率
