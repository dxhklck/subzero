HardwareAcceleration = 硬件加速
HardwareAccelerationDesc = 使用GPU或ONNX后端进行加速处理
HardwareAccelerationNO = CPU版本无法开启硬件加速功能
SubtitleYXAxisDifferencePixel = 高宽像素差阈值
SubtitleYXAxisDifferencePixelDesc = 用于判断是不是非字幕区域，默认为10 (一般认为字幕文本框的长度是要大于宽度的，如果字幕框的高大于宽，且大于的幅度超过指定像素点大小，则认为是错误检测)
SubtitleAreaDeviationPixel = 允许的像素偏移量
SubtitleAreaDeviationPixelDesc = 用于放大mask大小，防止自动检测的文本框过小，inpaint阶段出现文字边，有残留，默认为20
SubtitleAreaYAxisDifferencePixel = 同行字幕高度差阈值
SubtitleAreaYAxisDifferencePixelDesc = 同于判断两个文本框是否为同一行字幕，高度差距指定像素点以内认为是同一行，默认为20
SubtitleAreaPixelToleranceYPixel = Y轴容忍像素偏差
SubtitleAreaPixelToleranceYPixelDesc = 用于判断两个字幕文本的矩形框是否相似，如果Y轴偏差都在指定阈值内，则认为时同一个文本框，默认为20
SubtitleAreaPixelToleranceXPixel = X轴容忍像素偏差
SubtitleAreaPixelToleranceXPixelDesc = 用于判断两个字幕文本的矩形框是否相似，如果X轴偏差都在指定阈值内，则认为时同一个文本框，默认为20
SubtitleTimelineBackwardFrameCount = 字幕时间轴回退帧数
SubtitleTimelineBackwardFrameCountDesc = 用于在时间轴上在检测到字幕的基础上往前增加的处理帧数, 增加这个可以处理更加缓慢渐入的字幕, 默认为5帧
subtitleTimelineForwardFrameCount = 字幕时间轴前进帧数
subtitleTimelineForwardFrameCountDesc = 用于在时间轴上在检测到字幕的基础上往后增加的处理帧数, 增加这个可以处理更加缓慢渐出的字幕, 默认为5帧
SubtitleDetectSampleStep = 检测采样步长
SubtitleDetectSampleStepDesc = 每隔多少帧做一次OCR检测, 0为按帧率自适应(30fps以上每3帧), 默认为0。字幕通常持续0.5秒以上, 适当放宽可加快检测速度
SubtitleDetectProcessSize = 检测处理边长
SubtitleDetectProcessSizeDesc = 检测前把帧等比缩小到的长边上限(像素), 0为原分辨率, 默认为720。检测模型内部本就把长边缩到960, 因此设为720可让OCR单帧耗时下降约四成; 过小可能降低小字号字幕的检出率, 追求最高精度可设0, 长边不超过960的视频始终按原分辨率检测不被放大
SttnNeighborStride = 参考帧步长
SttnNeighborStrideDesc = 默认为5
SttnReferenceLength = 参考帧数量
SttnReferenceLengthDesc = 默认为10
SttnMaxLoadNum = 最大同时处理的帧数量
SttnMaxLoadNumDesc = 设置越大处理效果越好，但是要求显存越高，默认为50
MiniMaxMaxLoadNum = 单次最大加载帧数
MiniMaxMaxLoadNumDesc = 每次送入GPU的帧数，主要是速度参数：块越大固定开销摊越薄、越快（720p实测121帧比41帧端到端快约一成），对显存峰值影响很小。显存由条带分辨率决定，程序会按剩余显存校验并在日志提示，一般无需手动改
MiniMaxNumInferenceSteps = 去噪步数
MiniMaxNumInferenceStepsDesc = 越大质量略升、速度线性变慢，12为官方推荐平衡点，默认为8
MiniMaxIterations = 掩膜扩张迭代
MiniMaxIterationsDesc = 越大字幕残影越少但误伤画面越多，0为不扩张，默认为6
MiniMaxProcessWidth = 处理分辨率上限
MiniMaxProcessWidthDesc = 视频宽超过该值时先降采样推理、输出再放大回原分辨率，0为按原分辨率；1080p/4K 视频设 960~1280 可大幅提速
MiniMaxStripPadding = 条带外扩像素
MiniMaxStripPaddingDesc = 条带裁剪修复时 mask 向四周外扩的背景参考像素，越大修复质量越稳、耗时越多；0 为不外扩
MiniMaxBlockOverlap = 块间重叠帧数
MiniMaxBlockOverlapDesc = 视频分块推理时相邻块重叠这么多帧并线性混合，消除块边界闪烁，默认为8，0为关闭。开销随块大小递减，81帧块约多花一成时间
MiniMaxVaeDecodeFp32 = VAE解码 fp32
MiniMaxVaeDecodeFp32Desc = 解码器升 fp32，消除 fp16 VAE 在平坦背景（天空/墙面）的色带条带，画质更好但多占约1G显存；显存紧张可关
